[package]
name = "capsule-nexus-wire"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
datom = [
  "dep:datom-codec",
  "dep:protos",
  "signal-capsule-nexus/datom",
  "core-meta-capsule-nexus/datom",
  "meta-signal-capsule-nexus/datom",
  "shared-translator/datom",
]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { workspace = true }
signal-capsule-nexus = { workspace = true }
core-meta-capsule-nexus = { path = "../core-meta" }
meta-signal-capsule-nexus.workspace = true
shared-translator.workspace = true
nix = { version = "0.30", features = ["socket"] }
libc = "0.2"
# The shared feature set requires these dependency edges in the Cargo graph.
tokio = { version = "1.53", default-features = false, features = ["macros", "io-util", "net", "signal", "tracing"] }
mio = { version = "1.2", features = ["log"] }

[lints.rust]
unsafe_code = "forbid"
