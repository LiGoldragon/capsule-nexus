[package]
name = "capsule-nexus-translator"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
capsule-nexus-wire = { path = "../wire" }
core-meta-capsule-nexus = { path = "../core-meta" }
nix = { version = "0.30", features = ["fs", "poll", "process", "signal", "socket", "user"] }
rustix = { version = "1", features = ["process", "rand"] }
rkyv = { version = "0.8", features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }

[dependencies.signal-capsule-nexus]
git = "https://github.com/LiGoldragon/signal-capsule-nexus"
rev = "dc941e72a31f7084f80b6fa8fe9aa49963acb4a1"

[dependencies.shared-translator]
package = "translator"
git = "https://github.com/LiGoldragon/translator"
rev = "abc89b9"
features = ["unix"]


[features]
default = []
text = ["datom", "dep:protos", "dep:datom-codec", "signal-capsule-nexus/datom", "shared-translator/text"]
datom = []


[dependencies.emission-capsule-nexus]
path = "../emission"

[dependencies.meta-signal-capsule-nexus]
package = "meta-signal-capsule-nexus"
git = "https://github.com/LiGoldragon/meta-signal-capsule-nexus"
rev = "b8fde9e2be92f75945a208208d4b93d6e5fd7e69"
features = ["datom"]

[[bin]]
name = "capsule"
path = "src/bin/capsule.rs"
required-features = ["text"]
[[bin]]
name = "capsule-meta"
path = "src/bin/capsule-meta.rs"
required-features = ["text"]
[[bin]]
name = "capsule-place"
path = "src/bin/capsule-place.rs"
required-features = ["text"]

[[bin]]
name = "capsule-translator"
path = "src/bin/capsule-translator.rs"
required-features = ["text"]

[[bin]]
name = "capsule-pair"
path = "src/bin/capsule-pair.rs"
required-features = ["text"]
